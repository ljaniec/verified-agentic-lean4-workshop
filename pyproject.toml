[project]
name = "verified-agentic-lean4-workshop"
version = "0.2.0"
description = "Checked browser workshop on trustworthy AI agents and Lean 4."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.16,<2", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
